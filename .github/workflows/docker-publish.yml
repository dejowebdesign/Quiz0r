name: Build and Publish Quiz0r

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dejowebdesign/quiz0r

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Quiz0r
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ghcr.io/dejowebdesign/quiz0r:latest
            ghcr.io/dejowebdesign/quiz0r:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dejowebdesign/Quiz0r
            org.opencontainers.image.revision=${{ github.sha }}
