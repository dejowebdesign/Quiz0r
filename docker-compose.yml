version: "3.9"

services:
  quiz0r:
    container_name: quiz0r

    image: quiz0r:latest
    pull_policy: build

    build:
      context: .
      target: runner

    restart: unless-stopped

    ports:
      - "18081:3000"

    environment:
      NODE_ENV: production

      # SQLite
      DATABASE_URL: file:./prisma/data/quiz.db

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY}

      # FreeLLMAPI
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}

    volumes:
      - quiz0r-db:/app/prisma/data
      - quiz0r-uploads:/app/public/uploads

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  quiz0r-db:
  quiz0r-uploads:
